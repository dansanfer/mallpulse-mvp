name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: backend
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend
      - run: bundle exec rubocop
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mallpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RACK_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mallpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend
      - run: bundle exec rake db:migrate
      - run: bundle exec rspec
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mallpulse-${{ matrix.service }} .
      - name: Smoke test backend image
        if: matrix.service == 'backend'
        run: |
          docker run -d --name api -p 9292:9292 -e PORT=9292 -e CORS_ORIGINS=https://example.com \
            -e FRONTEND_URL=https://example.com -e SUPABASE_URL=https://example.supabase.co \
            -e VISITOR_TOKEN_SECRET=ci -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x mallpulse-backend
          for i in $(seq 1 30); do curl -fs localhost:9292/api/v1/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Smoke test frontend image
        if: matrix.service == 'frontend'
        run: |
          docker run -d -p 8080:8080 mallpulse-frontend
          for i in $(seq 1 15); do curl -fs localhost:8080/checkin/abc | grep -q '<div id="root">' && exit 0; sleep 1; done
          exit 1
